window.__fallbackRender=function(mode){
  const card=document.getElementById('card'); if(!card)return;
  const pages={
    gacha:'<h2>スカウト</h2><p>スカウトバナーを選択して選手を獲得</p><div class="gacha-tabs"><button class="gacha-tab selected" data-banner="standard"><b>STANDARD</b><small>通常スカウト</small></button><button class="gacha-tab" data-banner="legends"><b>LEGENDS</b><small>歴代スター</small></button><button class="gacha-tab" data-banner="limited"><b>LIMITED</b><small>限定選手</small></button><button class="gacha-tab" data-banner="power"><b>POWER</b><small>長打型</small></button><button class="gacha-tab" data-banner="speed"><b>SPEED & DEFENSE</b><small>走守型</small></button><button class="gacha-tab" data-banner="two-way"><b>TWO-WAY</b><small>二刀流</small></button></div><div class="banner-info"><b>所持コイン ∞</b><br>無料テスト中・コイン消費なし<div class="rate-row"><span>S 0.5%</span><span>A 8%</span><span>B 15%</span><span>C 22%</span><span>D 25%</span><span>F 29.5%</span></div></div><div class="row" style="margin-top:10px"><button class="action" id="fallback-pull">1回スカウト<br><small>無料</small></button><button class="action" id="fallback-pull10">10連スカウト<br><small>無料</small></button></div><div id="fallback-results" class="card" style="margin-top:10px;padding:12px;background:#050a11"><b>SCOUT READY</b><p>スカウトを開始できます。</p></div>',
    roster:'<h2>オーダー</h2><p>スタメン・ベンチ・投手を管理します。</p><div class="order-field"></div><div class="row"><button class="action">野手</button><button class="action">控え</button><button class="action">投手</button></div>',
    training:'<h2>育成</h2><p>所持選手の能力を個別に強化します。</p><div class="player-grid"><div class="player-card"><strong>打撃</strong><p>ミート・選球眼を強化</p></div><div class="player-card"><strong>パワー</strong><p>長打力を強化</p></div><div class="player-card"><strong>守備</strong><p>守備・肩力を強化</p></div><div class="player-card"><strong>走塁</strong><p>走力・盗塁を強化</p></div></div>',
    collection:'<h2>選手名鑑</h2><p id="fallback-collection-count">獲得選手を確認できます。</p><div id="fallback-collection-list" class="player-grid"></div>',
    settings:'<h2>設定</h2><p>ゲーム設定・保存データ</p><div class="card" style="padding:12px;background:#050a11"><b>ローカル保存</b><p>ブラウザ内にゲーム状態を保存します。</p></div>'
  };
  card.style.pointerEvents='auto';
  card.innerHTML=(pages[mode]||'<h2>HOME</h2><p>ホームへ戻りました。</p>')+'<button class="action back" id="fallback-back">ホームへ戻る</button>';
  document.getElementById('fallback-back').onclick=()=>window.__fallbackMode('home');
  if(mode==='collection'){
    const raw=localStorage.getItem('baseball3d.save.v1');
    const s=raw?JSON.parse(raw):{collection:[]};
    const ids=[...new Set(s.collection||[])];
    Promise.all([import('./src/data/players.js'),import('./src/game/player-models.js').catch(()=>null)]).then(([m])=>{
      const list=document.getElementById('fallback-collection-list'),count=document.getElementById('fallback-collection-count');
      const ps=ids.map(id=>m.ALL_PLAYERS.find(p=>p.id===id)).filter(Boolean);
      if(count)count.textContent='獲得 '+ps.length+' 名';
      if(list)list.innerHTML=ps.length?ps.map(p=>'<div class="player-card compact-player"><div class="player-head"><strong>'+String(p.name).replace(/[&<>]/g,'')+'</strong><b>'+p.rank+'</b></div><span class="player-meta">'+String(p.pos||'')+' · '+String(p.era||'')+'</span><div class="mini-stats"><span>打 '+(p.contact||'-')+'</span><span>パ '+(p.power||'-')+'</span><span>守 '+(p.field||'-')+'</span><span>走 '+(p.speed||'-')+'</span></div></div>').join(''):'<p class="small">まだ選手を獲得していません。</p>';
    });
  }
  if(mode==='gacha'){
    const resultBox=document.getElementById('fallback-results');
    const doPull=async(count)=>{
      const one=document.getElementById('fallback-pull'),ten=document.getElementById('fallback-pull10');
      one.disabled=true;ten.disabled=true;
      try{
        const [{pullOnce,pullMany},{ALL_PLAYERS}]=await Promise.all([import('./src/game/gacha-service.js'),import('./src/data/players.js')]);
        const raw=localStorage.getItem('baseball3d.save.v1');
        const save=raw?JSON.parse(raw):{version:1,currency:0,unlimitedCoins:true,collection:[],team:[],settings:{sound:true,haptics:true},progress:{matches:0,wins:0}};
        save.unlimitedCoins=true;
        const selected=document.querySelector('.gacha-tab.selected')?.dataset.banner||'standard';
        const r=count===1?pullOnce(save,ALL_PLAYERS,undefined,selected):pullMany(save,ALL_PLAYERS,10,undefined,selected);
        if(r.error) throw new Error(r.error);
        const results=count===1?[{result:r.result,duplicate:r.duplicate,duplicateReward:r.duplicateReward||0}]:r.results;
        localStorage.setItem('baseball3d.save.v1',JSON.stringify(r.state));
        try{
          const pres=await import('./src/game/presentation.js');
          const best=results.slice().sort((a,b)=>({S:6,A:5,B:4,C:3,D:2,F:1}[b.result.rank]||0)-({S:6,A:5,B:4,C:3,D:2,F:1}[a.result.rank]||0))[0];
          if(best?.result?.player) await pres.playGachaReveal({rarity:best.result.rarity,name:best.result.player.name,image:best.result.player.image,rank:best.result.rank,limited:best.result.limited,duplicate:best.duplicate,banner:selected,cardType:best.result.player.cardType,limitedTheme:best.result.player.limitedTheme});
        }catch(revealErr){console.warn('fallback reveal skipped',revealErr);}
        resultBox.innerHTML='<b>スカウト結果</b><div style="display:grid;gap:6px;margin-top:8px">'+results.map(x=>'<div style="padding:8px;border:1px solid #ffffff20;border-radius:7px"><strong>'+String(x.result.player.name).replace(/[&<>]/g,'')+'</strong>　'+x.result.rank+'</div>').join('')+'</div>';
      }catch(err){
        resultBox.innerHTML='<b>スカウト処理エラー</b><p>'+String(err?.message||err)+'</p>';
      }finally{one.disabled=false;ten.disabled=false;}
    };
    const fallbackTabs=document.querySelectorAll('.gacha-tab');
    fallbackTabs.forEach((tab)=>{
      tab.onclick=()=>{
        fallbackTabs.forEach(x=>x.classList.remove('selected'));
        tab.classList.add('selected');
        const name=tab.querySelector('b')?.textContent||'SCOUT';
        const info=document.getElementById('fallback-results');
        if(info)info.innerHTML='<b>'+name+' 選択中</b><p>このバナーからスカウトできます。</p>';
      };
      tab.ontouchend=(e)=>{e.preventDefault();tab.click()};
      tab.style.pointerEvents='auto';
    });
    const pull1=document.getElementById('fallback-pull'),pull10=document.getElementById('fallback-pull10');
    pull1.onclick=()=>doPull(1); pull10.onclick=()=>doPull(10);
    pull1.ontouchend=(e)=>{e.preventDefault();doPull(1)}; pull10.ontouchend=(e)=>{e.preventDefault();doPull(10)};
    pull1.style.pointerEvents='auto'; pull10.style.pointerEvents='auto';
  }
};
window.__fallbackMode=function(mode,force){
  const home=document.getElementById('home'),view=document.getElementById('view'),match=document.getElementById('match-ui');
  if(!home||!view||!match)return;
  if(window.__setMode&&!force&&window.__gameReady&&!window.__lastGameError){window.__setMode(mode);return;}
  home.classList.toggle('hidden',mode!=='home');
  view.classList.toggle('hidden',mode==='home'||mode==='match');
  match.classList.toggle('hidden',mode!=='match');
  if(mode!=='home'&&mode!=='match')window.__fallbackRender(mode);
};
document.addEventListener('click',function(e){
  const b=e.target.closest?.('[data-mode]');
  if(!b)return;
  e.preventDefault();
  /* Prefer the real application once its module is ready; use fallback only during startup/error. */
  window.__fallbackMode(b.dataset.mode,false);
},true);
setTimeout(function(){if(!window.__gameReady||window.__lastGameError){window.__fallbackMode('home',true);}},1200);
