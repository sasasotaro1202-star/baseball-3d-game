<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07101d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><title>Baseball 3D Game</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2"}}</script><script>window.__gameReady=false;window.__lastGameError="";window.addEventListener("error",e=>window.__lastGameError=String(e?.message||e?.error||"runtime error"));window.addEventListener("unhandledrejection",e=>window.__lastGameError=String(e?.reason?.message||e?.reason||"promise rejection"));</script><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#fff;background:#07101d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%}.panel{position:fixed;inset:0;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 18px);pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;letter-spacing:.16em;font-weight:800}.currency{background:#ffffff16;border:1px solid #ffffff25;border-radius:999px;padding:8px 12px;font-size:13px}.screen{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}.screen.hidden{display:none}.home{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 24px);gap:10px}.hero{margin-bottom:auto;padding-top:70px}.hero h1{font-size:36px;margin:0 0 8px;letter-spacing:-.04em}.hero p{margin:0;color:#b8c3d2;font-size:13px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;pointer-events:auto}.menu button,.action{border:1px solid #ffffff24;background:#101d2df0;color:#fff;border-radius:18px;padding:16px;font-size:15px;font-weight:800;box-shadow:0 10px 30px #0004}.menu .primary{grid-column:1/-1;padding:19px;background:#ffffff18}.view{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}.card{background:#07101de8;border:1px solid #ffffff20;border-radius:22px;padding:18px;pointer-events:auto;backdrop-filter:blur(18px)}.card h2{margin:0 0 8px;font-size:22px}.card p{margin:6px 0;color:#b8c3d2;font-size:13px}.row{display:flex;gap:10px}.row>*{flex:1}.back{margin-top:10px}.reveal{font-size:24px;font-weight:900;padding:22px 0;text-align:center}.small{font-size:12px;color:#91a0b3}.matchhud{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#07101de8;border:1px solid #ffffff20;border-radius:999px;padding:9px 14px;white-space:nowrap}.matchcontrols{display:flex;gap:12px;pointer-events:auto}.matchcontrols button{flex:1;border:1px solid #ffffff25;background:#07101de8;color:#fff;border-radius:18px;padding:17px;font-weight:900}.danger{opacity:.7}#presentation{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .16s ease}.pres-show{opacity:1!important;visibility:visible!important}.pres-vignette{position:absolute;inset:0;background:radial-gradient(circle at center,#ffffff00 25%,#000b 100%)}.pres-kicker,.pres-title,.pres-sub{position:absolute;text-align:center;left:10%;right:10%;text-shadow:0 4px 24px #000}.pres-kicker{top:31%;font-size:12px;letter-spacing:.28em;font-weight:900;color:#cbd5e1}.pres-title{top:39%;font-size:clamp(30px,10vw,62px);font-weight:1000;letter-spacing:-.05em}.pres-sub{top:53%;font-size:13px;color:#d7dee8}.gacha-sequence .pres-title{animation:presPulse .6s ease infinite alternate}.gacha-build .pres-title{letter-spacing:.2em;opacity:.9}.gacha-reveal .pres-title{animation:presReveal .75s cubic-bezier(.2,1.4,.3,1)}.gacha-reveal.legend .pres-title{font-size:clamp(38px,13vw,82px);text-shadow:0 0 28px #fff,0 6px 35px #000}.gacha-reveal.star .pres-title{font-size:clamp(34px,11vw,70px)}.pres-flash{position:absolute;inset:0;background:#fff;opacity:0}.pres-flash.active{animation:presFlash .18s ease-out}.match-event.home_run .pres-title{font-size:clamp(42px,15vw,96px);animation:presReveal .65s cubic-bezier(.2,1.5,.3,1)}.match-event{background:linear-gradient(180deg,#0007,#0000 45%,#0008)}@keyframes presPulse{to{transform:scale(1.05);opacity:.72}}@keyframes presReveal{0%{transform:scale(.55);opacity:0;filter:blur(8px)}70%{transform:scale(1.06);opacity:1;filter:blur(0)}100%{transform:scale(1)}}@keyframes presFlash{0%{opacity:.9}100%{opacity:0}}</style></head><body><canvas id="game"></canvas><div class="panel"><div class="top"><span class="brand">BASEBALL 3D</span><span id="currency" class="currency">1,000</span></div><div id="home" class="screen home"><div class="hero"><h1>BASEBALL 3D</h1><p>PLAY • BUILD • COLLECT</p></div><div class="menu"><button class="primary" data-mode="match">試合をはじめる</button><button data-mode="gacha">スカウト</button><button data-mode="roster">オーダー</button><button data-mode="training">育成</button><button data-mode="collection">選手名鑑</button><button data-mode="settings">設定</button></div></div><div id="view" class="screen view hidden"><div id="card" class="card"></div></div><div id="match-ui" class="screen hidden"><div id="matchhud" class="matchhud">1回表　0 - 0　0 OUT</div><div class="matchcontrols"><button id="pitch">投球</button><button id="swing">打つ</button><button id="matchback" class="danger">終了</button></div></div></div><script type="module" src="./src/main.js"></script></body></html>
