<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08111f"><title>Baseball 3D Game</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700}#controls{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom);padding:18px;display:flex;justify-content:flex-end;gap:12px}button{border:1px solid #ffffff44;background:#ffffff18;color:#fff;border-radius:18px;padding:16px 20px;font-size:16px;font-weight:700;backdrop-filter:blur(10px)}</style></head><body><canvas id="game"></canvas><div id="hud"><span>BASEBALL 3D</span><span id="count">0 - 0</span></div><div id="controls"><button id="pitch">PITCH</button><button id="swing">SWING</button></div><script type="module" src="./src/main.js"></script></body></html>
