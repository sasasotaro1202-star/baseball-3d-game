name: CI
concurrency:
  group: baseball-3d-game-${{ github.workflow }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build\n      - run: node scripts/web-smoke.mjs
